appId: com.ikarishinjiii.gabay
productName: Gabay
directories:
  output: dist
files:
  - out/**
  - resources/**
  - "!resources/*.svg"
  - "!resources/*.bmp"
  - "!resources/THIRD-PARTY-NOTICES.txt"
  - package.json
asar: true
# The license and third-party notices sit next to Gabay.exe, where people can read them.
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: resources/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
electronDist: node_modules/electron/dist
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
  # Unsigned: Windows SmartScreen will warn on first run. Signing needs a certificate.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Black-and-mint artwork; regenerate with: npx electron scripts/render-installer.cjs
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
# Writes latest.yml (with the installer SHA-512) next to the installer; the in-app updater verifies against it.
publish:
  provider: github
  owner: IkariShinjiii
  repo: gabay
