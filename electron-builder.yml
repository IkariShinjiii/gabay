appId: com.ikarishinjiii.gabay
productName: Gabay
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: x64
  # Unsigned: Windows SmartScreen will warn on first run. Signing needs a certificate.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
